<!DOCTYPE html>
<html lang="ku" dir="rtl"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پانێلا ئەدمین | SEPAN STYLE</title><link rel="icon" href="favicon.png">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Kufi+Arabic:wght@600;800&family=Vazirmatn:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{font:15px/1.7 Vazirmatn,sans-serif;color:var(--ink);padding:14px 14px calc(50px + env(safe-area-inset-bottom,0px));min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.w{max-width:560px;margin:0 auto}
.cap{display:block;font:700 11px 'Cormorant Garamond',serif;letter-spacing:5px;color:var(--r2);direction:ltr}
.script{display:block;font:400 64px/1.1 'Great Vibes',cursive;direction:ltr;background:linear-gradient(110deg,var(--ink),var(--r3) 55%,var(--r1));-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{display:inline-block;padding:3px;border-radius:50%;background:conic-gradient(#F9DFD3,#B76E79,#D9A08C,#8d4a55,#F9DFD3);box-shadow:var(--sh)}.ring img{display:block;width:84px;height:84px;border-radius:50%;border:3px solid var(--bg)}
label{display:block;font-weight:700;font-size:13.5px;margin:16px 0 6px}
input:not([type=checkbox]),select{width:100%;padding:13px 16px;border-radius:16px;border:1.5px solid rgba(183,110,121,.28);background:var(--glass);color:var(--ink);font:inherit;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--r3);box-shadow:0 0 0 4px rgba(183,110,121,.18)}
.go{position:relative;overflow:hidden;display:block;width:100%;margin-top:20px;padding:14px;border-radius:99px;background:var(--g);color:var(--on);font-weight:800;box-shadow:0 14px 30px -12px var(--r3);transition:transform .2s}
.go::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-100px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sh 4s infinite}@keyframes sh{40%,100%{left:130%}}
.go:active{transform:scale(.97)}.go:disabled{opacity:.6}
.ghost{padding:7px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);font-size:13px;font-weight:700;color:var(--ink)}
.msg{min-height:24px;margin-top:10px;text-align:center;color:var(--r3);font-weight:700;font-size:13.5px}
.lg{min-height:calc(100vh - 40px);display:grid;place-items:center}
.lg-card{width:100%;max-width:400px;text-align:center;padding:34px 24px 26px;border-radius:36px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh)}
.lg-card label{text-align:start}.lg-card .script{margin-top:12px}.lg-card .cap{margin-bottom:6px}
.sw{display:flex!important;align-items:center;gap:10px;font-weight:500!important;color:var(--mute);cursor:pointer}.sw input{display:none}
.sw i{flex:none;width:42px;height:24px;border-radius:99px;background:rgba(183,110,121,.25);position:relative;transition:.25s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.sw input:checked+i{background:var(--g)}.sw input:checked+i::after{inset-inline-start:21px}
.bar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 7px 14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--edge);box-shadow:var(--sh);margin-bottom:16px}
.bb{display:flex;align-items:center;gap:10px;direction:ltr}.bb img{width:38px;height:38px;border-radius:50%}.bb b{display:block;font:700 16px 'Cormorant Garamond',serif;letter-spacing:3px;line-height:1.1}.bb .cap{font-size:9px;letter-spacing:4px}
.bar-r{display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{text-align:center;padding:14px 6px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh)}
.st b{display:block;font:700 28px/1.1 'Cormorant Garamond',serif;color:var(--r1)}.st span{font-size:12px;color:var(--mute);font-weight:700}
.panel{position:relative;padding:24px 18px 20px;margin-bottom:16px;border-radius:32px;background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh)}
.panel::before{content:"";position:absolute;top:0;inset-inline:34px;height:2px;border-radius:2px;background:var(--g)}
.panel h2{font:800 19px 'Noto Kufi Arabic',sans-serif;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{margin:0!important;cursor:pointer}.chip input{display:none}
.chip span{display:block;min-width:46px;text-align:center;padding:8px 14px;border-radius:99px;border:1.5px solid rgba(183,110,121,.3);font-weight:700;font-size:13px;color:var(--mute);transition:.2s}
.chip input:checked+span{background:var(--g);color:var(--on);border-color:transparent;box-shadow:0 8px 18px -8px var(--r3)}
.drop{display:flex!important;flex-direction:column;align-items:center;gap:2px;padding:20px;border-radius:22px;border:1.5px dashed rgba(183,110,121,.5);background:rgba(183,110,121,.06);text-align:center;color:var(--mute);cursor:pointer;font-weight:500!important}
.drop b{color:var(--r1);font-size:15px}.drop input{display:none}
.pv{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.pv img{flex:none;width:60px;height:74px;object-fit:cover;border-radius:14px;box-shadow:var(--sh)}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(183,110,121,.18)}.it:first-child{border-top:0}
.th{flex:none;width:62px;height:78px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:26px;box-shadow:var(--sh)}.th img{width:100%;height:100%;object-fit:cover}
.in{flex:1;min-width:0}.in b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font:700 15px 'Cormorant Garamond',serif;color:var(--r1);letter-spacing:.5px}.pr small{font:500 12px Vazirmatn;color:var(--mute)}
.ch{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.ch i,.ch em{font-style:normal;font-size:11px;font-weight:700;padding:0 9px;border-radius:99px;background:rgba(183,110,121,.14);color:var(--r1)}.ch em{background:var(--g);color:var(--on)}.ch em.x{background:#3A2125;color:#fff}
.it.so .th img{filter:grayscale(.7);opacity:.6}
.ac{display:flex;flex-direction:column;gap:6px}.ac button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);color:var(--r1);transition:.2s}
.ac button:active{transform:scale(.88)}.ac button.d{color:#c0392b}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.none{text-align:center;color:var(--mute);padding:26px 0}
.out{display:block;margin:6px auto 0}
</style></head><body><div class="w">
<div id="login" class="lg"><div class="lg-card">
<span class="ring"><img src="logo.png" alt=""></span>
<span class="script">Sepan</span><span class="cap">ADMIN PANEL</span>
<label>توکنا GitHub</label><input id="tk" type="password" dir="ltr" placeholder="github_pat_..." autocomplete="off">
<label class="sw"><input type="checkbox" id="rm"><i></i><span>توکنێ ل سەر ڤی ئامیری بپارێزە</span></label>
<button class="go" onclick="signIn()">چوونا ژۆر</button><p id="lm" class="msg"></p></div></div>
<div id="app" hidden>
<div class="bar"><div class="bb"><img src="logo.png" alt=""><div><b>SEPAN STYLE</b><span class="cap">ADMIN PANEL</span></div></div><div class="bar-r"><a class="ghost" href="index.html" target="_blank">وێبسایت</a><button class="ghost" onclick="signOut()">دەرکەفتن</button></div></div>
<div class="stats" id="stats"></div>
<section class="panel"><span class="cap" style="text-align:start">NEW PRODUCT</span><h2>بەرهەمەکێ نوی</h2>
<label>ناڤ</label><input id="n">
<label>نرخ (دینار، ئەگەر نزانی ڤالا بهێڵە)</label><input id="p" inputmode="numeric">
<label>جۆر</label><select id="cat"><option>کراس </option><option>بلوز</option><option>پەنتەرون </option><option>عەبا</option><option>سێت</option><option>تر</option></select>
<label>سایز</label><div class="chips" id="sz"></div>
<label>وێنە</label><label class="drop"><b>＋ وێنەی هەلبژێرە</b><span>دکارێ چەندان وێنەیان هەلبژێری</span><input id="f" type="file" accept="image/*" multiple></label><div class="pv" id="pv"></div>
<label class="sw"><input type="checkbox" id="nw"><i></i><span>نیشانکرن ب "نوی"</span></label>
<button class="go" id="ab" onclick="add()">زێدەکرن</button><p id="msg" class="msg"></p></section>
<section class="panel"><span class="cap" style="text-align:start">COLLECTION</span><h2>بەرهەمێن هەین</h2><div id="list"></div></section>
</div></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G={o:CFG.GH_OWNER,r:CFG.GH_REPO,b:CFG.GH_BRANCH||''};let TK='',L=[];
try{TK=localStorage.getItem('tk')||''}catch(e){}
if(!G.o||!G.r)$('lm').textContent='⚠️ ناڤێ GitHub و repository ل config.js پڕ بکە';
const num=s=>+String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g,'')||null;
const api=(p,o={})=>fetch(`https://api.github.com/repos/${G.o}/${G.r}/contents/${p}`,{...o,headers:{Authorization:'Bearer '+TK,Accept:'application/vnd.github+json'}});
const bd=o=>JSON.stringify(G.b?{...o,branch:G.b}:o);
const enc=s=>{let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
$('sz').innerHTML=['S','M','L','XL','XXL','Free size'].map(s=>`<label class="chip"><input type="checkbox" value="${s}"><span>${s}</span></label>`).join('');
$('f').onchange=()=>{$('pv').innerHTML=[...$('f').files].map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('')};
async function get(){const r=await api('products.json'+(G.b?'?ref='+encodeURIComponent(G.b):''));
 if(r.ok){const j=await r.json();return{data:JSON.parse(dec(j.content)),sha:j.sha}}
 let m='';try{m=(await r.json()).message||''}catch(e){}
 if(r.status===401)throw new Error('توکن خەلەتە یان بوویە کۆن');
 if(r.status===404){
  const rr=await fetch(`https://api.github.com/repos/${G.o}/${G.r}`,{headers:{Authorization:'Bearer '+TK,Accept:'application/vnd.github+json'}});
  if(!rr.ok)throw new Error('repository نەهاتە دیتن. GH_OWNER و GH_REPO ل config.js ڕاست بکە، و ببینە توکن مافێ ڤی repositoryی هەیە');
  if(/ref|branch|commit/i.test(m))throw new Error('branch نەهاتە دیتن. GH_BRANCH ل config.js بگۆڕە (main یان master) یان ڤالا بهێلە');
  return{data:[]}}
 throw new Error('GitHub '+r.status+(m?': '+m:''))}
async function mutate(fn,msg){const {data,sha}=await get(),nd=fn(data);
 const r=await api('products.json',{method:'PUT',body:bd({message:msg,content:enc(JSON.stringify(nd,null,1)),sha})});
 if(!r.ok)throw new Error((await r.json()).message||r.status);return nd}
function shrink(file){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(file)})}
async function upImg(f){const b=await shrink(f),data=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(b)}),path='images/'+Date.now()+Math.random().toString(36).slice(2,6)+'.jpg';
 const r=await api(path,{method:'PUT',body:bd({message:'add image',content:data})});
 if(!r.ok)throw new Error((await r.json()).message||r.status);return path}
async function show(){if(!TK){$('login').hidden=false;$('app').hidden=true;return}
 try{L=(await get()).data;$('lm').textContent='';$('login').hidden=true;$('app').hidden=false;draw()}catch(e){$('lm').textContent=e.message;$('login').hidden=false;$('app').hidden=true}}
function signIn(){TK=$('tk').value.trim();if(!TK){$('lm').textContent='توکنێ بنڤیسە';return}$('lm').textContent='دهێتە پشکنین...';try{if($('rm').checked)localStorage.setItem('tk',TK)}catch(e){}show()}
function signOut(){TK='';try{localStorage.removeItem('tk')}catch(e){}$('tk').value='';show()}
async function add(){const n=$('n').value.trim();if(!n)return alert('ناڤی بنڤیسە');
 $('ab').disabled=true;
 try{say('وێنە دهێنە بارکرن...');const im=[];for(const f of $('f').files)im.push(await upImg(f));
  say('بەرهەم دهێتە پاراستن...');
  const sizes=[...document.querySelectorAll('#sz input:checked')].map(x=>x.value),pr=num($('p').value),cat=$('cat').value,nw=$('nw').checked;
  L=await mutate(d=>[{id:Date.now(),name:n,price:pr,category:cat,sizes,images:im,is_new:nw,soldout:false},...d],'add product');
  $('n').value=$('p').value=$('f').value='';$('pv').innerHTML='';document.querySelectorAll('#sz input,#nw').forEach(x=>x.checked=false);
  say('✅ زێدە بوو! دەمەکێ کێم خوو بگرە هەتا وێبسایت نوی دبیت');draw()}
 catch(e){say('خەلەتی: '+e.message)}$('ab').disabled=false}
async function act(id,t){try{let pr;
 if(t==='d'&&!confirm('تو پشتڕاستی دڤێت ڤی بەرهەمی ژێ ببەی؟'))return;
 if(t==='p'){const v=prompt('نرخێ نوی (دینار):');if(v===null)return;pr=num(v)}
 say('دهێتە پاراستن...');
 L=await mutate(d=>t==='d'?d.filter(p=>p.id!=id):d.map(p=>p.id!=id?p:t==='s'?{...p,soldout:!p.soldout}:{...p,price:pr}),'update product');
 say('✅ هاتە پاراستن');draw()}catch(e){say('خەلەتی: '+e.message)}}
const I=d=>`<svg class="i" viewBox="0 0 24 24">${d}</svg>`,
 ic={p:I('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),ok:I('<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'),no:I('<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>'),d:I('<path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/>')};
function draw(){const so=L.filter(p=>p.soldout).length;
 $('stats').innerHTML=`<div class="st"><b>${L.length}</b><span>بەرهەم</span></div><div class="st"><b>${L.length-so}</b><span>ئامادە</span></div><div class="st"><b>${so}</b><span>تەمام بوو</span></div>`;
 $('list').innerHTML=L.map(p=>`<div class="it${p.soldout?' so':''}"><div class="th">${p.images?.[0]?`<img src="${esc(p.images[0])}" alt="">`:'👗'}</div><div class="in"><b>${esc(p.name)}</b><div class="pr">${p.price?p.price.toLocaleString('en')+' <small>دینار</small>':'—'}</div><div class="ch">${p.category?`<i>${esc(p.category)}</i>`:''}${(p.sizes||[]).map(s=>`<i>${esc(s)}</i>`).join('')}${p.is_new?'<em>نوی</em>':''}${p.soldout?'<em class="x">تەمام بوو</em>':''}</div></div><div class="ac"><button title="نرخ" onclick="act(${+p.id},'p')">${ic.p}</button><button title="${p.soldout?'ئامادەیە':'تەمام بوو'}" onclick="act(${+p.id},'s')">${p.soldout?ic.ok:ic.no}</button><button class="d" title="سڕین" onclick="act(${+p.id},'d')">${ic.d}</button></div></div>`).join('')||'<p class="none">هێشتا بەرهەم نینن</p>'}
show();
</script></body></html>
